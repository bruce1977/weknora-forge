services:
  weknora-forge:
    # build: . 保留用于本地/CI 构建；纯拉取部署请用 `docker compose pull && docker compose up -d --no-build`
    build: .
    image: bruce1977/weknora-forge:latest
    pull_policy: always
    ports:
      - "8000:8000"
    volumes:
      # Read-only mount of the Forge config *directory* (FORGE_CONFIG=/data in the image).
      # Place your production config.json on the host so it appears at /data/config.json.
      - /data:/data:ro
    env_file:
      - .env
    environment:            # Set default LOG_LEVEL here if present
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
