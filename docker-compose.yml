services:
  weknora-forge:
    build: .
    image: bruce1977/weknora-forge:latest
    ports:
      - "8000:8000"
    volumes:
      # Read-only mount of the Forge config (FORGE_CONFIG=/data/config.json in the image).
      # Place your production config.json on the host at /data/config.json.
      - /data:/data:ro
    env_file:
      - .env
    environment:            # Set default LOG_LEVEL here if present
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
